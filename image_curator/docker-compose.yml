version: '3.8'

services:
  image-curator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: image-curator-app
    ports:
      - "${API_PORT:-8005}:8005"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-8005}
    volumes:
      - ./curated_output:/app/curated_output:z
      - ./temp_downloads:/app/temp_downloads:z
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
